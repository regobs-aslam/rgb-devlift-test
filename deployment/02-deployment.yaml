apiVersion: apps/v1
kind: Deployment
metadata:
  name: ajmal-trial-us-01-test-user
  namespace: ajmal-ns
  annotations:
    reloader.stakater.com/auto: 'true'
  labels:
    app: ajmal-trial-us-01-test-user
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ajmal-trial-us-01-test-user
  template:
    metadata:
      labels:
        app: ajmal-trial-us-01-test-user
        devlift.ai/tenant: ajmal
        devlift.ai/environment: stage
        devlift.ai/service: ajmal-trial-us-01-test-user
    spec:
      serviceAccountName: ajmal-trial-us-01-test-user-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/instance-category
                    operator: NotIn
                    values: ["g", "p"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: ajmal-trial-us-01-test-user
          image: 443245368846.dkr.ecr.us-east-1.amazonaws.com/ajmal-trial-us-01-test-user:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ajmal-trial-us-01-test-user-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: ajmal-trial-us-01-test-user-secrets
                  key: POSTGRES_DATABASE
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ajmal-trial-us-01-test-user-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: ajmal-trial-us-01-test-user-secrets
                  key: POSTGRES_PORT
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: ajmal-trial-us-01-test-user-secrets
                  key: POSTGRES_HOST
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ajmal-trial-us-01-test-user-secrets
                  key: HF_TOKEN
          volumeMounts:
            - name: secrets-store
              mountPath: "/var/secrets"
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ajmal-trial-us-01-test-user-secrets-csi
